<title>Deep Research Video Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one column; the 16:9 player is the page, controls and a scene index sit beneath it. */
:root {
  --bg: #f7f8f5; --surface: #ffffff; --fg: #1b1d18; --muted: #5f6659; --line: #dfe3d8;
  --accent: #66C61C; --accent-ink: #2f5d14; --accent-soft: #e4f6d2;
  --serif: 'IBM Plex Serif', Georgia, serif; --sans: 'Public Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121410; --surface: #1b1e18; --fg: #eef1e9; --muted: #a3ab99; --line: #30352b;
  --accent: #7ad636; --accent-ink: #b9ef8f; --accent-soft: #263a17; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121410; --surface: #1b1e18; --fg: #eef1e9; --muted: #a3ab99; --line: #30352b;
  --accent: #7ad636; --accent-ink: #b9ef8f; --accent-soft: #263a17; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(26px, 4vw, 38px); letter-spacing: -0.02em; margin: 4px 0 0; text-wrap: balance; }
.meta { color: var(--muted); font-variant-numeric: tabular-nums; }
.stage { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
.controls { display: flex; align-items: center; gap: 14px; }
button.play { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent); color: #10200a; font-size: 18px; cursor: pointer; display: grid; place-items: center; }
button.play:focus-visible, input[type=range]:focus-visible, .scenes button:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 2px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: right; }
.scenes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.scenes button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; cursor: pointer; }
.scenes button .ts { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; flex: none; width: 40px; }
.scenes button[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.note { color: var(--muted); font-size: 13px; margin: 0; }
</style>
<div class="wrap">
  <header>
    <div><div class="eyebrow">Lead with AI · Preview</div><h1>Deep Research</h1></div>
    <div class="meta">20 scenes · 3:20 · 1920×1080</div>
  </header>
  <div class="stage"><div id="player"></div></div>
  <div class="controls">
    <button class="play" id="play" aria-label="Play">▶</button>
    <input type="range" id="seek" min="0" max="200" step="0.05" value="0" aria-label="Seek">
    <div class="time" id="time">0:00 / 3:20</div>
  </div>
  <ol class="scenes" id="scenes"></ol>
  <p class="note">Live preview of the Remotion composition with the final voiceover (Take A). The video itself starts with a 3-second title card before the voiceover.</p>
</div>
<audio id="vo" preload="auto" src="data:audio/mpeg;base64,__AUDIO__"></audio>
<script>
(function(){
  var OFFSET = 3;
  var S = [[0,'Answers in seconds'],[10.08,'Some questions need more'],[17.52,'What a hard question needs'],[25.36,'Deep Research'],[29.28,'Delegate, don’t just ask'],[42.36,'How it works'],[54.2,'Example: regular chat'],[62.88,'Deep Research goes further'],[74.32,'Not how much'],[81.76,'Three situations'],[85.84,'Strategic decisions'],[96.04,'Synthesizing evidence'],[109.36,'Unfamiliar topics'],[122.16,'Not a substitute'],[127.08,'It can get things wrong'],[140.08,'A citation isn’t proof'],[153.76,'Use it deliberately'],[168.4,'The real shift'],[174.88,'Who does what'],[186.88,'Better-informed decisions']];
  var a = document.getElementById('vo'), play = document.getElementById('play'), seek = document.getElementById('seek'), time = document.getElementById('time'), list = document.getElementById('scenes');
  var fmt = function(s){ s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
  var btns = S.map(function(sc, i){
    var li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = '<span class="ts">' + fmt(sc[0] + OFFSET) + '</span><span>' + (i+1) + '. ' + sc[1] + '</span>';
    b.addEventListener('click', function(){ a.currentTime = sc[0] + OFFSET; });
    li.appendChild(b); list.appendChild(li); return b;
  });
  play.addEventListener('click', function(){ a.paused ? a.play() : a.pause(); });
  a.addEventListener('play', function(){ play.textContent = '❚❚'; play.setAttribute('aria-label','Pause'); });
  a.addEventListener('pause', function(){ play.textContent = '▶'; play.setAttribute('aria-label','Play'); });
  seek.addEventListener('input', function(){ a.currentTime = Number(seek.value); });
  (function loop(){
    var t = a.currentTime, d = a.duration || 200;
    if (document.activeElement !== seek) seek.value = t;
    seek.max = d; time.textContent = fmt(t) + ' / ' + fmt(d);
    var cur = -1; for (var i = 0; i < S.length; i++) if (t >= S[i][0] + OFFSET) cur = i;
    btns.forEach(function(b, i){ b.setAttribute('aria-current', i === cur ? 'true' : 'false'); });
    requestAnimationFrame(loop);
  })();
})();
</script>
<script>__BUNDLE__</script>
